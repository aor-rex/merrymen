<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>
/**
 * THE ONE TOKEN SET.
 *
 * Every name is prefixed --mm-, and that prefix is the whole migration
 * strategy: globals.css defines --bg, --border, --green, --radius on :root and
 * console.css defines a DIFFERENT palette (--line, --panel, --lime, --mint) on
 * .sc-root. Zero of those collide with --mm-*, so this file can be live on the
 * same page as either of them while /grant and /settings are still being served
 * by the old sheets. Nothing has to be retired before anything else can ship.
 *
 * WHY THE GREEN GROUND GOES. The product ran on #0d1512 with mint as the gain
 * colour, so green was doing two jobs at once — the background family AND the
 * semantic for "up". A green "bought" chip on a green-black card has almost no
 * separation, which is most of why the old UI reads muddy rather than sleek.
 * The ground is now a cool graphite that keeps a whisper of the original teal
 * cast, and green is freed to mean exactly one thing.
 *
 * And --lime (#b6e226, decorative) sat next to --mint (#3ad884, semantic). At
 * chip size those are both just "green", so the palette had two greens and one
 * meaning. Lime is retired.
 *
 * WHY THE GRAPHITE WENT. The same fault one level up. #0b0f10 was the ground
 * AND the darkest step of every ramp drawn on it, so nothing on this page could
 * burn. On #000000 the amber has somewhere to go. And --mm-warn gave up three
 * of its four jobs — paper, pending, stale — to the dashed convention in
 * base.css, because a colour that means four things means none of them. It now
 * means one: THE WALL SAID NO.
 *
 * THE RULE: colour means something, or it is not on screen. The page is
 * achromatic; the only saturated pixels are semantics — up, down, warn — and
 * the wire.
 *
 * SINGLE THEME, DELIBERATELY. This is a dark trading surface and it commits to
 * that, so there is no prefers-color-scheme block. Everything is painted
 * explicitly, including the body background, so nothing borrows a ground from
 * the host.
 */

:root {
  /* ── ground: TOTAL BLACK ──────────────────────────────────────────────
     #0b0f10 was a good graphite and it is also the reason this page has
     never had anywhere for a hot colour to burn. A dithered ramp on
     graphite has nowhere to go; on absolute black it has everywhere.     */
  --mm-bg: #000000;          /* the page */
  --mm-surface: #0b0d0e;     /* cards, sticky header — a card is its edge, not its fill */
  --mm-surface-2: #121517;   /* hover, raised, segmented track, the trade strip */
  --mm-surface-3: #1a1e20;   /* inputs, avatar wells */
  --mm-edge: #232729;        /* hairline — internal rules */
  --mm-edge-2: #333a3d;      /* hairline, emphasised — the card seam */

  /* ── text: WARM off-white, never #FFF ─────────────────────────────────
     On true black a pure white is a razor, and this is a reading product.
     Warm also keeps the text from going blue against the amber ramp.     */
  --mm-tx: #e9e6e1;          /* 16.9:1 */
  --mm-tx-2: #b3afa9;        /* body secondary, 9.6:1 */
  --mm-dim: #918d86;         /* labels, 6.4:1 */
  --mm-faint: #757068;       /* timestamps ONLY — never load-bearing, 4.3:1 */

  /* ── semantics: unchanged values, one narrowed meaning ─────────────────
     --mm-up and --mm-down are the feed's primary scan cue — buy vs sell is
     a sub-200ms judgement down a column of near-identical cards — and they
     do not move.

     --mm-warn is PROMOTED to the hot accent and NARROWED to one meaning:
     THE WALL SAID NO. It no longer carries paper, pending or stale; those
     moved to the dashed convention in base.css, which costs no colour. That
     is what makes it safe to spend a masthead on it — a colour that means
     four things means none of them.                                       */
  --mm-up: #34d399;          /* bought · gain */
  --mm-down: #fb7185;        /* sold · loss */
  --mm-warn: #fbbf24;        /* THE ONE HOT ACCENT · refused · turned back */

  /* ── the wire ─────────────────────────────────────────────────────────
     Unchanged, and it gains by subtraction: now the only cool colour on a
     page that is otherwise black, white and amber.                        */
  --mm-wire: #5cc8ff;
  --mm-wire-dim: #2e7fa8;

  /* ── the band ramp: six stops, quantised, CANVAS ONLY ──────────────────
     Never a UI colour. --mm-thru is the ramp's top stop and the absence of
     the wall: a white pixel on this site means exactly one thing — an
     intent got through — so it may not appear anywhere in the interface.  */
  --mm-ramp-0: #000000;
  --mm-ramp-1: #3a1600;
  --mm-ramp-2: #7a2e00;
  --mm-ramp-3: #c77a0b;
  --mm-ramp-4: #fbbf24;
  --mm-thru: #ffffff;

  /* ── shape ────────────────────────────────────────────────────────────
     AGENT = SQUIRCLE, TOKEN = CIRCLE is the only thing telling the two
     apart at 24px with no label. The band has no radius at all — a pixel
     grid does not round.                                                  */
  --mm-r-card: 16px;
  --mm-r-chip: 6px;
  --mm-r-agent: 10px;
  --mm-r-token: 999px;

  /* ── space: a 4px scale ──────────────────────────────────────────────── */
  --mm-1: 4px;
  --mm-2: 8px;
  --mm-3: 12px;
  --mm-4: 16px;
  --mm-5: 20px;
  --mm-6: 24px;
  --mm-8: 32px;
  --mm-10: 40px;

  /* THE CELL. The canvas's cell, the kerf's rhythm and the space scale's
     unit are the same 4px. Changing this changes the picture. */
  --mm-cell: 4px;

  /* ── type ─────────────────────────────────────────────────────────────
     --mm-display is GEIST PIXEL and it is display ONLY: below roughly 24px
     the square grid stops being legible and the face turns to mush. It
     appears in exactly two places in the product, and both are
     system-generated integers.                                            */
  --mm-display: var(--font-geist-pixel), var(--font-geist), ui-monospace, monospace;
  --mm-sans: var(--font-geist), system-ui, -apple-system, "Segoe UI", sans-serif;
  --mm-mono: var(--font-geist-mono), ui-monospace, "Geist Mono", Menlo, monospace;

  /* ── chrome ──────────────────────────────────────────────────────────── */
  --mm-nav-h: 56px;
  --mm-header-h: 52px;
  --mm-col: 640px;
  --mm-rail: 304px;
  --mm-context: 320px;
  --mm-band-h: 168px;        /* the band on /, >=860 */
  --mm-band-h-sm: 132px;     /* the band on /, <860 */
  --mm-band-h-agent: 96px;   /* the still band on /a/<slug> */

  /* ── motion ──────────────────────────────────────────────────────────── */
  --mm-ease: cubic-bezier(0.2, 0.7, 0.3, 1);
  --mm-fast: 140ms;
}


/*
 * THREE BREAKPOINTS. NAMED. THAT IS ALL.
 *
 * There were five unrelated sets — globals at 980/760/640/420, console at
 * 940/860/720/540/520, grant at 720, feed at 480 — and the 720/760 disagreement
 * produced a 40px band where the shell collapsed but the page around it did
 * not. These are declared here as documentation; CSS custom properties cannot
 * be used in media queries, so the literals below are repeated in each sheet
 * and MUST match:
 *
 *    520px   phone -> large phone   (card metrics loosen)
 *    860px   THE collapse point     (bottom tab bar <-> left rail)
 *   1180px   desktop                (the context column appears)
 *
 * Do not add a fourth without deleting one.
 */
/**
 * The shell every new surface sits in.
 *
 * EVERY RULE IS SCOPED UNDER .mm — and unlike console.css, which claimed the
 * same thing in its header and was wrong for thirty selectors with no build
 * error, this claim is enforced by styles/scoped.test.ts.
 *
 * The scoping is what lets the old sheets stay live during the migration. One
 * class beats globals.css's bare element selectors (a, button, html, body), so
 * both systems can render on the same page and the new one wins where they
 * overlap, without a single !important.
 */

.mm {
  background: var(--mm-bg);
  color: var(--mm-tx);
  font-family: var(--mm-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  /* The app has its own vertical rhythm; globals.css's body padding is for the
     old shell and must not add to it. */
  min-height: 100vh;
  min-height: 100dvh;
}

.mm *,
.mm *::before,
.mm *::after {
  box-sizing: border-box;
}

/* Names, handles and symbols are owner-typed and launcher-supplied. One long
   word must never set the width of the page — globals.css records that bare
   `1fr` tracks were most of the dashboard's 413px of mobile overflow. */
.mm :where(h1, h2, h3, p, span, b, div) {
  overflow-wrap: anywhere;
}

.mm a {
  color: inherit;
  text-decoration: none;
}

.mm a:hover {
  color: var(--mm-wire);
}

.mm button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

/* Mono is for numbers and identifiers, always, and always tabular — a feed
   whose figures jitter between polls is a feed nobody trusts. */
.mm .mono {
  font-family: var(--mm-mono);
  font-variant-numeric: tabular-nums;
}

/* There was no visible focus ring anywhere in the product. */
.mm :focus-visible {
  outline: 2px solid var(--mm-wire);
  outline-offset: 2px;
  border-radius: var(--mm-r-chip);
}

.mm ::selection {
  background: color-mix(in srgb, var(--mm-wire) 30%, transparent);
}

/* ── the reading column ──────────────────────────────────────────────────── */

.mm-wrap {
  width: 100%;
  max-width: var(--mm-col);
  margin: 0 auto;
  padding: 0 var(--mm-4);
}

/* Wide content scrolls inside itself. The page body never scrolls sideways. */
.mm-scroll-x {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── section kicker ──────────────────────────────────────────────────────── */

.mm-kicker {
  font-family: var(--mm-mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  color: var(--mm-dim);
}

/* ── chips ───────────────────────────────────────────────────────────────── */

.mm-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--mm-1);
  font-family: var(--mm-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 3px 6px;
  border-radius: var(--mm-r-chip);
  border: 1px solid transparent;
  white-space: nowrap;
}

.mm-chip.up {
  color: var(--mm-up);
  background: color-mix(in srgb, var(--mm-up) 12%, transparent);
  border-color: color-mix(in srgb, var(--mm-up) 26%, transparent);
}
.mm-chip.down {
  color: var(--mm-down);
  background: color-mix(in srgb, var(--mm-down) 12%, transparent);
  border-color: color-mix(in srgb, var(--mm-down) 26%, transparent);
}
.mm-chip.warn {
  color: var(--mm-warn);
  background: color-mix(in srgb, var(--mm-warn) 12%, transparent);
  border-color: color-mix(in srgb, var(--mm-warn) 26%, transparent);
}
.mm-chip.wire {
  color: var(--mm-wire);
  background: color-mix(in srgb, var(--mm-wire) 12%, transparent);
  border-color: color-mix(in srgb, var(--mm-wire) 26%, transparent);
}
/*
 * THIS DID NOT FULLY HAPPEN.
 *
 * A second axis, orthogonal to the first: a chip's COLOUR says what kind of
 * thing it was, its EDGE says whether it actually occurred. The badge
 * vocabulary spends three of its five kinds on things that are provisional or
 * non-events and had no way to draw the difference — hue separation has already
 * failed at 10px.
 *
 * It is also what frees --mm-warn to mean exactly one thing, which is the
 * precondition for spending a masthead on it. And it is not a new invention
 * here: .mm-trade.sim was already dashed, with the comment "A PRETEND FILL MUST
 * NOT LOOK LIKE A REAL ONE". This finishes a convention that was half-made.
 */
.mm-chip.unsettled {
  border-style: dashed;
}

/* Outline only, no fill: the quietest thing that is still a label. */
.mm-chip.quiet {
  color: var(--mm-dim);
  border-color: var(--mm-edge-2);
}

/* ── buttons ─────────────────────────────────────────────────────────────── */

.mm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--mm-2);
  min-block-size: 40px;
  padding: 0 var(--mm-4);
  border-radius: var(--mm-r-chip);
  border: 1px solid var(--mm-edge-2);
  background: var(--mm-surface-2);
  color: var(--mm-tx);
  font-size: 13.5px;
  font-weight: 600;
  transition:
    background-color var(--mm-fast) var(--mm-ease),
    border-color var(--mm-fast) var(--mm-ease),
    color var(--mm-fast) var(--mm-ease);
}

.mm-btn:hover {
  background: var(--mm-surface-3);
  border-color: var(--mm-wire-dim);
  color: var(--mm-tx);
}

.mm-btn.primary {
  border-color: color-mix(in srgb, var(--mm-wire) 40%, transparent);
  background: color-mix(in srgb, var(--mm-wire) 14%, transparent);
  color: var(--mm-wire);
}

.mm-btn.primary:hover {
  background: color-mix(in srgb, var(--mm-wire) 22%, transparent);
}

.mm-btn[disabled] {
  opacity: 0.5;
  cursor: default;
}

/* ── motion ──────────────────────────────────────────────────────────────── */

@media (prefers-reduced-motion: reduce) {
  .mm *,
  .mm *::before,
  .mm *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
/**
 * Token cards. Scoped under .mm, enforced by styles/scoped.test.ts.
 */

.mm-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--mm-3);
  padding: var(--mm-4) 0;
}

.mm-card {
  display: flex;
  flex-direction: column;
  gap: var(--mm-3);
  padding: var(--mm-4);
  border: 1px solid var(--mm-edge);
  border-radius: var(--mm-r-card);
  background: var(--mm-surface);
}

.mm-card.skel {
  min-height: 168px;
  background: var(--mm-surface-2);
  border-style: dashed;
}

.mm-card > header {
  display: flex;
  align-items: flex-start;
  gap: var(--mm-3);
}

/* TOKEN = CIRCLE. An agent avatar is a squircle, and that difference is the
   only thing telling the two apart at 24px with no label. */
.mm .mm-art {
  width: 36px;
  height: 36px;
  flex: none;
  border-radius: var(--mm-r-token);
  object-fit: cover;
  background: var(--mm-surface-3);
}

.mm .mm-art.fallback {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mm-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--mm-dim);
}

.mm-card .idc {
  min-width: 0;
  flex: 1;
}

.mm-card .tick {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: var(--mm-2);
}

.mm-card .tick b {
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--mm-tx);
}

.mm-card .tick .nm {
  font-size: 12px;
  color: var(--mm-dim);
}

.mm-card .meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--mm-2);
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--mm-faint);
}

.mm-card .chg {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.mm-card .chg.up {
  color: var(--mm-up);
}
.mm-card .chg.down {
  color: var(--mm-down);
}

/* ── the curve progress bar ──────────────────────────────────────────────── */

.mm-grad {
  display: flex;
  align-items: center;
  gap: var(--mm-2);
}

.mm-grad .gbar {
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: var(--mm-surface-3);
  overflow: hidden;
}

.mm-grad .gbar i {
  display: block;
  height: 100%;
  background: var(--mm-wire);
}

.mm-grad .glab {
  font-size: 10.5px;
  color: var(--mm-faint);
  white-space: nowrap;
}

/* ── what it says about itself ───────────────────────────────────────────── */

.mm-card .say {
  margin: 0;
  font-size: 13px;
  line-height: 1.55;
  color: var(--mm-tx-2);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.mm-card .say.none {
  color: var(--mm-faint);
  font-style: italic;
}

/* ── figures ─────────────────────────────────────────────────────────────── */

.mm-figs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--mm-2);
  font-size: 12.5px;
  color: var(--mm-tx-2);
}

.mm-figs span {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.mm-figs i {
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mm-faint);
}

/* ── the agent's verdict ─────────────────────────────────────────────────── */

.mm-verdict {
  display: flex;
  align-items: flex-start;
  gap: var(--mm-2);
  padding: var(--mm-2) var(--mm-3);
  border-radius: var(--mm-r-chip);
  border-left: 2px solid var(--mm-wire);
  background: var(--mm-surface-2);
}

/* Marks, never a score out of five — conviction is an ORDERING, not a rating. */
.mm-verdict .pips {
  font-family: var(--mm-mono);
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--mm-wire);
  white-space: nowrap;
}

.mm-verdict .vsay {
  font-size: 12px;
  line-height: 1.5;
  color: var(--mm-tx-2);
}

/* ── footer ──────────────────────────────────────────────────────────────── */

.mm-card > footer {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--mm-2);
  margin-top: auto;
  padding-top: var(--mm-1);
}

.mm-card .soc {
  font-family: var(--mm-mono);
  font-size: 11px;
  color: var(--mm-dim);
}

.mm-card a.soc:hover {
  color: var(--mm-wire);
}

.mm-card .soc.mute {
  color: var(--mm-faint);
}

.mm-card .soc.go {
  margin-left: auto;
  color: var(--mm-wire);
  font-weight: 600;
}

.mm-badge {
  font-family: var(--mm-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 3px 6px;
  border-radius: var(--mm-r-chip);
  white-space: nowrap;
}

.mm-badge.in {
  color: var(--mm-up);
  border: 1px solid color-mix(in srgb, var(--mm-up) 30%, transparent);
}

.mm-badge.out {
  color: var(--mm-dim);
  border: 1px solid var(--mm-edge-2);
}

/* ── the one degraded-read banner ────────────────────────────────────────── */

.mm-readfail {
  margin: var(--mm-4) 0 0;
  padding: var(--mm-3);
  border: 1px solid color-mix(in srgb, var(--mm-warn) 30%, transparent);
  border-radius: var(--mm-r-chip);
  background: color-mix(in srgb, var(--mm-warn) 7%, transparent);
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--mm-warn);
}

/* ── the segmented control ───────────────────────────────────────────────── */

.mm-seg {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border-radius: var(--mm-r-chip);
  background: var(--mm-surface-2);
}

.mm-seg button {
  min-block-size: 30px;
  padding: 0 var(--mm-3);
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--mm-dim);
  transition:
    background-color var(--mm-fast) var(--mm-ease),
    color var(--mm-fast) var(--mm-ease);
}

.mm-seg button.on {
  background: var(--mm-surface-3);
  color: var(--mm-tx);
}

@media (max-width: 520px) {
  .mm-cards {
    grid-template-columns: minmax(0, 1fr);
  }
}
/**
 * The agent profile. Scoped under .mm, enforced by styles/scoped.test.ts.
 *
 * Reads causally top to bottom: who it is, how it has done, what it holds, what
 * it said. The wire graph lands between the header and the holdings when it
 * exists — who an agent listens to belongs above what it owns, because it is
 * the cause and the holdings are the effect.
 */

.mm-profile {
  padding: var(--mm-5) 0;
  border-bottom: 1px solid var(--mm-edge);
}

.mm-profile-top {
  display: flex;
  align-items: center;
  gap: var(--mm-4);
}

.mm-profile-who {
  min-width: 0;
}

.mm-profile-who h2 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--mm-tx);
}

.mm-profile-who p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--mm-dim);
}

/* ── the four figures ────────────────────────────────────────────────────── */

.mm-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--mm-3);
  margin: var(--mm-5) 0 0;
}

.mm-stat {
  padding: var(--mm-3);
  border: 1px solid var(--mm-edge);
  border-radius: var(--mm-r-chip);
  background: var(--mm-surface);
}

.mm-stat dd {
  margin: var(--mm-1) 0 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--mm-tx);
}

.mm-stat dd.up {
  color: var(--mm-up);
}
.mm-stat dd.down {
  color: var(--mm-down);
}
/* "unranked" is a word and must not be sized like a figure. */
.mm-stat dd.flat {
  font-size: 14px;
  font-weight: 600;
  color: var(--mm-dim);
}

.mm-stat p {
  margin: var(--mm-1) 0 0;
  font-size: 11px;
  line-height: 1.4;
  color: var(--mm-faint);
}

.mm-profile-curve {
  margin-top: var(--mm-5);
}

.mm-profile-curve .mm-spark {
  width: 100%;
  height: auto;
}

/* ── holdings ────────────────────────────────────────────────────────────── */

.mm-holdings,
.mm-agent-feed {
  padding: var(--mm-5) 0;
}

.mm-agent-feed {
  border-top: 1px solid var(--mm-edge);
}

.mm-note {
  margin: var(--mm-2) 0 0;
  max-width: 58ch;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--mm-dim);
}

.mm-holdlist {
  list-style: none;
  margin: var(--mm-3) 0 0;
  padding: 0;
}

.mm-holdlist li {
  display: grid;
